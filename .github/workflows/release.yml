name: release

on:
  workflow_run: # after ci passed on main
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # publish the latest tag again, after a failed release

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit ci tested
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/caarlos0/svu/v3@v3.4.0
      - name: Tag the next version, if the commits call for one
        id: tag
        run: |
          current=$(svu current)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! git rev-parse -q --verify "refs/tags/$current" > /dev/null; then
              echo "No tag to release yet"
              exit 1
            fi
            git checkout -q "$current"
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(svu next --v0)
          if [ "$next" = "$current" ]; then
            echo "No release needed (current: $current)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.tag != '' && hashFiles('web/package.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        if: steps.tag.outputs.tag != '' && hashFiles('web/package.json') != ''
        run: cd web && npm install && npm run build && touch dist/.gitkeep # the build empties dist; GoReleaser needs a clean tree
      - uses: docker/setup-qemu-action@v3
        if: steps.tag.outputs.tag != ''
      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.tag != ''
      - uses: docker/login-action@v3
        if: steps.tag.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
